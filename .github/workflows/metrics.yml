name: Metrics

on:
  # Daily refresh at 03:00 UTC (00:00 Córdoba)
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cartudev
          filename: metrics.svg

          base: header, activity, community, repositories

          template: radical
          config_timezone: America/Argentina/Cordoba

          # Full-year 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Real language split (private repos included via METRICS_TOKEN)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
