name: Metrics

on:
  # Daily refresh at 03:00 UTC (00:00 Córdoba)
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/generate_city.py"

concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cartudev
          filename: metrics.svg

          base: header, activity, community, repositories

          template: terminal
          config_timezone: America/Argentina/Cordoba

          # Half-year reads better at this width (full-year renders as a sliver)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Real language split (private repos included via METRICS_TOKEN)
          # categories: programming only — markup (CSS/SCSS/HTML) inflates via theme build assets
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          plugin_languages_limit: 8

      - name: Generate contribution city
        run: python3 .github/scripts/generate_city.py city.svg
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage BOTH generated files first: lowlighter/metrics rewrites metrics.svg,
          # and pull --rebase refuses to run on a dirty worktree
          git add metrics.svg city.svg
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "ci: refresh metrics + city"
          git push
